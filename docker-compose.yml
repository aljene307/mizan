# Mizan — pile locale : PostgreSQL + n8n + task runner externe.
# Démarrage : docker compose up -d   |   Arrêt : docker compose down
# Toutes les valeurs sensibles viennent du fichier .env (voir .env.example).

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MIZAN_DB: ${MIZAN_DB}
      MIZAN_APP_PASSWORD: ${MIZAN_APP_PASSWORD}
      # PostgreSQL 18 a changé son dossier de données par défaut ; on le fixe
      # pour qu'il reste dans le volume (recommandation de la doc n8n).
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, au tout premier démarrage (volume vide).
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Tests du schéma, lancés avec : docker compose exec postgres sh /db/tests/lancer.sh
      - ./db/tests:/db/tests:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Base de données interne de n8n
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Chiffrement des identifiants enregistrés dans n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Fuseau horaire (nœuds planifiés, dates)
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Les nœuds de lecture/écriture de fichiers n'ont accès qu'à /data
      N8N_RESTRICT_FILE_ACCESS_TO: /data
      # Task runner en mode externe : le JavaScript des nœuds Code
      # s'exécute dans le conteneur « runners », isolé de n8n.
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - n8n-data:/home/node/.n8n
      # Factures et relevés (lecture seule — à revoir à l'étape 3)
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5678:5678"
    # Réseau par défaut (base, OCR, runners) + réseau dédié à la passerelle
    # Telegram, que n8n est le seul autre conteneur à rejoindre (D-064).
    networks:
      - default
      - canal-telegram

  runners:
    # Doit avoir exactement la même version que l'image n8n.
    image: docker.io/n8nio/runners:${N8N_VERSION}
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"

  # OCR (Tesseract, français) pour les images et les PDF scannés (D-032).
  # Aucun port publié : n8n l'appelle sur http://ocr:8884 (réseau Docker interne).
  ocr:
    build: ./ocr
    image: mizan-ocr:1
    restart: unless-stopped
    environment:
      OCR_LANGUE: fra
      OCR_PSM: "3"

  # Passerelle Telegram (D-064) : seul conteneur qui reçoit le jeton du bot.
  # Aucun port publié ; joignable seulement sur le réseau « canal-telegram »,
  # que seul n8n rejoint : ni l'OCR, ni les runners, ni la base ne la voient.
  passerelle-telegram:
    build: ./passerelle-telegram
    image: mizan-passerelle-telegram:1
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    networks:
      - canal-telegram

  # Outil de migrations, lancé à la demande (profil « outils ») :
  #   docker compose run --rm dbmate up       applique les migrations en attente
  #   docker compose run --rm dbmate status   liste les migrations appliquées
  #   docker compose run --rm dbmate rollback annule la dernière migration
  dbmate:
    image: ghcr.io/amacneil/dbmate:${DBMATE_VERSION}
    profiles: ["outils"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MIZAN_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
      DBMATE_WAIT: "true"
    volumes:
      - ./db:/db

volumes:
  postgres-data:
  n8n-data:

networks:
  # Réseau de la passerelle Telegram : n8n et la passerelle seulement.
  # Non « internal » : la passerelle doit joindre api.telegram.org.
  canal-telegram:
